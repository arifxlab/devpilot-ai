[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-ai"
version = "0.1.0"
description = "A personal AI engineering assistant for project-aware software development."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Arif Khan" }
]

keywords = [
    "ai",
    "agent",
    "engineering",
    "assistant",
    "llm",
    "rag",
    "fastapi"
]

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "typer>=0.17.4",
    "rich>=14.1.0",
    "gitpython>=3.1.45",
    "sentence-transformers>=5.1.0",
    "faiss-cpu>=1.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "black>=25.1.0",
    "ruff>=0.12.8",
    "mypy>=1.17.1"
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]